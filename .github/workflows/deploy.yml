name: 自动部署到 Windows 服务器

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 部署到 Windows 服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 123.57.229.31
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            cd C:\project\bom-manager-full\projects
            git pull origin main
            mysql -u root -p${{ secrets.MYSQL_PASSWORD }} bom_system < bom_system_schema.sql
            pnpm install
            pnpm run build
            taskkill /f /im node.exe /t 2>nul
            start /B cmd /c "pnpm run start"