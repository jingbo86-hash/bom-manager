name: 自动部署到 Windows 服务器

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 递增版本号
        run: |
          VERSION=$(cat version.txt)
          MAJOR=$(echo $VERSION | cut -d'.' -f1)
          MINOR=$(echo $VERSION | cut -d'.' -f2)
          NEW_MINOR=$((MINOR + 1))
          echo "$MAJOR.$NEW_MINOR" > version.txt
          git config user.name "Auto Deploy"
          git config user.email "deploy@bot.com"
          git add version.txt
          git commit -m "chore: bump version to $MAJOR.$NEW_MINOR [skip ci]"
          git push

      - name: 通过 SSH 部署到 Windows 服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 123.57.229.31
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          script: |
            cd /d C:\project\bom-manager-full
            git pull origin main
            mysql -u root -p${{ secrets.MYSQL_PASSWORD }} bom_system < bom_system_schema.sql
            pnpm install
            pnpm run build
            taskkill /f /im node.exe /t 2>nul
            start "" cmd /c "pnpm run start"