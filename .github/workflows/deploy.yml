name: 自动部署到 Windows 服务器

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 递增版本号
        run: |
          VERSION=$(cat version.txt)
          MAJOR=$(echo $VERSION | cut -d'.' -f1)
          MINOR=$(echo $VERSION | cut -d'.' -f2)
          NEW_MINOR=$((MINOR + 1))
          echo "$MAJOR.$NEW_MINOR" > version.txt
          git config user.name "Auto Deploy"
          git config user.email "deploy@bot.com"
          git add version.txt
          git commit -m "chore: bump version to $MAJOR.$NEW_MINOR [skip ci]"
          git push

      - name: 打包代码
        run: |
          tar czf /tmp/deploy.tar.gz \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='pnpm-lock.yaml' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='next-env.d.ts' \
            --exclude='.codegraph' \
            .

      - name: 上传代码到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 123.57.229.31
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: /tmp/deploy.tar.gz
          target: C:\project\

      - name: 在服务器上部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 123.57.229.31
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 30s
          command_timeout: 15m
          script_stop: true
          script: |
            cmd /c "if not exist C:\project\bom-manager-full mkdir C:\project\bom-manager-full && cd /d C:\project && tar -xzf deploy.tar.gz -C bom-manager-full && del deploy.tar.gz && cd bom-manager-full && powershell -NoProfile -ExecutionPolicy Bypass deploy.ps1 -MYSQL_PASSWORD ${{ secrets.MYSQL_PASSWORD }}"